name: build

on:
  push:
    branches:
      - master
      - github-ci
    tags:
      - 'upstream/*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            container: debian:12
            distro: bookworm
          - runner: ubuntu-24.04-arm
            container: debian:12
            distro: bookworm
          - runner: ubuntu-latest
            container: debian:13
            distro: trixie
          - runner: ubuntu-24.04-arm
            container: debian:13
            distro: trixie
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      # --no-install-recommends: buildds don't install recommends either, and
      # git-buildpackage's recommends pull in pbuilder, whose setup hangs on
      # debian:12 without a preseeded mirror.
      - name: install packaging tools
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends ca-certificates git gh git-buildpackage build-essential fakeroot rsync openssh-client

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: dovecot
          show-progress: false
          fetch-depth: 0

      # Install the build dependencies straight from debian/control, the same
      # set a Debian buildd would resolve, instead of a hand-maintained list.
      - name: install build dependencies
        run: apt-get build-dep -y --no-install-recommends ./dovecot

      # Debian buildds build as an unprivileged user (fakeroot for binary
      # targets). This also matters for correctness: the upstream test suite
      # (test-buffer-istream) fails when run as root, because root can read
      # mode-0000 files.
      - name: build (unit tests enabled)
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cat > /tmp/ci-build.sh <<'EOF'
          set -ex
          export HOME=/home/builder
          cd "$GITHUB_WORKSPACE/dovecot"
          git config --global user.name "test"
          git config --global user.email "test@example.org"
          git rm -rq .github
          git commit -qam "CI: remove .github directory before building"
          # GitHub forks don't carry tags: if the upstream/<version> tag gbp
          # would use for the orig tarball is missing, generate the tarball
          # from the branch itself minus debian/ (SLOPPY).
          uversion=$(dpkg-parsechangelog -SVersion | sed -e 's/^[0-9]*://' -e 's/-[^-]*$//')
          tree_opt=""
          if ! git rev-parse -q --verify "upstream/${uversion}^{commit}" >/dev/null; then
            echo "tag upstream/${uversion} not found, using --git-upstream-tree=SLOPPY"
            tree_opt="--git-upstream-tree=SLOPPY"
          fi
          DEB_BUILD_OPTIONS="parallel=$(nproc)" gbp buildpackage --git-ignore-branch --git-no-pristine-tar $tree_opt -us -uc
          EOF
          runuser -u builder -- bash /tmp/ci-build.sh

      - name: upload .deb files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.KEY }}" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          version=$(cd dovecot && dpkg-parsechangelog -Sversion | sed 's/^1://')
          rsync -rLvh --ignore-existing --mkpath \
            -e "ssh -i $HOME/.ssh/key -o StrictHostKeyChecking=no" \
            $GITHUB_WORKSPACE/build-area/ \
            "${{ secrets.USERNAME }}@download.delta.chat:/var/www/html/download/dovecot/${{ matrix.distro }}/${version}/"

      - name: upload to github release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cd dovecot && dpkg-parsechangelog -Sversion | sed 's/^1://')
          tag="upstream/${version}"
          for f in $GITHUB_WORKSPACE/build-area/dovecot-core_*.deb \
                   $GITHUB_WORKSPACE/build-area/dovecot-imapd_*.deb \
                   $GITHUB_WORKSPACE/build-area/dovecot-lmtpd_*.deb; do
            mv "$f" "${f%.deb}_${{ matrix.distro }}.deb"
          done
          # Publish the .buildinfo too: it records the exact toolchain and
          # build-dependency versions, which is what allows anyone to
          # reproduce/verify these binaries later (debrebuild-style).
          for f in $GITHUB_WORKSPACE/build-area/dovecot_*.buildinfo; do
            mv "$f" "${f%.buildinfo}_${{ matrix.distro }}.buildinfo"
          done
          gh release create "$tag" --title "$tag" || true
          gh release upload "$tag" --clobber \
            $GITHUB_WORKSPACE/build-area/dovecot-core_*_${{ matrix.distro }}.deb \
            $GITHUB_WORKSPACE/build-area/dovecot-imapd_*_${{ matrix.distro }}.deb \
            $GITHUB_WORKSPACE/build-area/dovecot-lmtpd_*_${{ matrix.distro }}.deb \
            $GITHUB_WORKSPACE/build-area/dovecot_*_${{ matrix.distro }}.buildinfo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
